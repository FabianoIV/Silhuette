name: Deploy main to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prepare deploy package
        run: |
          mkdir deploy
          cp -r dist deploy/dist
          printf '%s\n' '{"name":"silhouette","private":true,"scripts":{"start":"node dist/Silhouette/server/server.mjs"}}' > deploy/package.json

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: Silhuette
          resource-group-name: VueTest_group
          package: deploy