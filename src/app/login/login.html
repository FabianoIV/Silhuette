<main class="login">
  <img class="login__logo" src="brand/logo.png" width="403" height="333" alt="Silhouette" />

  <form class="panel" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Zaloguj się</h1>
    <p class="lead">
      Bez sesji serwer oddaje tylko ten ekran. Reszta aplikacji jest renderowana dopiero dla
      zalogowanego użytkownika.
    </p>

    <label class="field">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="username" />
    </label>

    <label class="field">
      <span>Hasło</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <button class="button" type="submit" [disabled]="pending()">
      {{ pending() ? 'Logowanie…' : 'Wejdź' }}
    </button>

    <p class="hint">Konto demonstracyjne: ada&#64;silhouette.dev / silhouette</p>
  </form>
</main>
